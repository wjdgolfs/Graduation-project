# 여러 실행 파일이 함께 사용하는 설정입니다. 경로와 기준값을 한곳에서 관리합니다.
# 아래 경로는 이 PC의 D: 드라이브를 기준으로 합니다. 데이터 위치를 옮기면 각 경로도 수정하세요.
paths:
  # 데이터 저장소의 최상위 폴더. 환경 점검 코드에서 존재 여부를 확인합니다.
  data_root: "D:/Graduation-project-data"
  # 원본 영상용으로 마련한 경로. 현재 스크립트는 raw 대신 temp의 테스트 영상을 읽습니다.
  raw: "D:/Graduation-project-data/raw"
  # 가공 데이터용 예약 경로. 현재 코드에서는 사용하지 않습니다.
  processed: "D:/Graduation-project-data/processed"
  # extract_frames.py가 골라낸 JPG 이미지의 저장 위치입니다.
  frames: "D:/Graduation-project-data/frames"
  # 2단계 부위 신호(preprocessing/region_signals.py)의 결과 폴더입니다. 데이터셋마다 하위 폴더를 만듭니다.
  regions: "D:/Graduation-project-data/regions"
  # 모델 가중치 폴더. FTCN·MediaPipe·XceptionNet 가중치와 학습한 모델(paper_model.checkpoint_dir)이 이 아래에 있습니다.
  checkpoints: "D:/Graduation-project-data/checkpoints"
  # 실험 결과 폴더. 장면 변화 점수·그래프, 학습 로그와 테스트 지표(paper_model.results_dir) 등을 저장합니다.
  results: "D:/Graduation-project-data/results"
  # create_test_video.py가 만드는 실험용 MP4를 저장합니다.
  temp: "D:/Graduation-project-data/temp"

preprocessing:
  # 영상 전체에서 균등 간격으로 골라 저장할 이미지 수입니다.
  # 장면 전환 탐지는 이 값과 무관하게 원본 영상의 프레임을 순차 비교합니다.
  num_frames: 16

scene_detection:
  # 점수는 이웃한 이미지의 평균 밝기 차이를 0~1로 정규화한 값이며 확률이 아닙니다.
  # 급격한 전환을 판단하는 높은 기준값입니다. 낮추면 더 작은 변화도 후보가 됩니다.
  # detect_scene_transition.py에서는 후보 구간 길이가 2 이하라는 조건도 필요합니다.
  hard_cut_threshold: 0.20
  # 연속된 변화 구간을 모으기 시작하는 낮은 기준값입니다.
  gradual_threshold: 0.005
  # 점진적 전환으로 판단하는 데 필요한 최소 연속 프레임 수이며, 초 단위가 아닙니다.
  # create_scene_signal.py는 높은 기준 미만인 후보만 모으므로 탐지 코드와 판정이 다를 수 있습니다.
  min_gradual_frames: 5

pilot:
  # 0단계 파일럿: real 영상에 장면 전환을 넣었을 때 시간 기반 탐지기(FTCN) 점수가 오르는지 봅니다.
  # FF++ 공식 분할 중 어디서 고를지. FTCN 이 train 분할로 학습됐으므로 본 적 없는 test 를 씁니다.
  split: "test"
  # 파일럿에 쓸 real 영상 수. split 분할 영상 중 받아진 것을 이름순으로 앞에서부터 고릅니다.
  num_videos: 10
  # 영상마다 앞에서부터 잘라 쓸 프레임 수. FTCN 이 32프레임씩 보므로 전환 앞뒤로 여유를 둡니다.
  segment_frames: 256
  # 전환 구간의 중심 프레임 번호. 가장 긴 64프레임 디졸브도 앞뒤로 96프레임씩 여유가 남습니다.
  transition_center: 128
  # 전환 종류별 길이(프레임 수). hard_cut 은 길이가 없어 0 하나만 둡니다.
  transitions:
    hard_cut: [0]
    fade: [8, 16, 32]
    dissolve: [8, 16, 32, 64]
  # 대조군과 합성본을 같은 조건으로 다시 압축합니다. CRF 23 은 FF++ c23 과 같은 값입니다.
  crf: 23
  preset: "medium"

ftcn:
  # FTCN 공식 코드 위치(프로젝트 폴더 기준). 라이선스가 없어 git 추적에서 제외했습니다.
  repo_dir: "third_party/FTCN"
  # FTCN 과 얼굴 검출·랜드마크 가중치 3개가 있는 폴더입니다.
  weights_dir: "D:/Graduation-project-data/checkpoints/FTCN"

mediapipe:
  # 얼굴 랜드마크(478점) 모델 파일. scripts/setup_mediapipe.py 가 받고 sha256 을 확인합니다.
  face_landmarker: "D:/Graduation-project-data/checkpoints/mediapipe/face_landmarker.task"

preprocess:
  # 얼굴 전처리(preprocessing/extract_faces.py) 설정. 원 논문(이대현·문종섭 2020): 영상마다 30프레임, 240x240 RGB
  frames: 30
  # consecutive: start_frame 부터 연속 프레임 / uniform: 영상 전체에서 고르게
  # 논문이 "인접한 프레임 사이의 불연속"을 학습하므로 연속 프레임을 기본으로 둡니다.
  sampling: "consecutive"
  start_frame: 0
  crop_size: 240
  # 랜드마크를 감싼 상자에서 가장 긴 변의 몇 배를 잘라낼지. 얼굴 경계 바깥까지 담으려고 넉넉히 잡습니다.
  crop_scale: 1.3
  # 크롭 상자 떨림을 줄이는 이동 평균 창 크기(프레임 수). 1 이하면 끕니다.
  box_smoothing: 5
  # 배경 통계용 전체 프레임 흑백 축소판의 긴 변 픽셀 수
  thumb_max_side: 160
  # 배경에서 뺄 영역 = 얼굴 상자의 몇 배. 머리카락·목·어깨처럼 사람과 함께 움직이는 부분을 빼기 위해 넓게 잡습니다.
  background_exclusion_scale: 2.0
  # 얼굴 찾기(두 단계): 앞 프레임 얼굴 상자를 search_window_scale 배로 넓힌 영역만 잘라 MediaPipe 에 넣습니다.
  # 처음이거나 못 찾으면 프레임 전체 → 한 변이 짧은 변의 search_window_fraction 배인 겹치는 창을 가운데부터 넣어 봅니다.
  # MediaPipe 는 얼굴이 화면에서 작으면(Celeb-DF 는 폭 10% 안팎) 전체 프레임에서 놓치기 때문입니다.
  search_window_scale: 3.0
  search_window_fraction: 0.5
  # 한 프레임에서 찾을 최대 얼굴 수. 여러 명이면 앞 프레임과 가장 많이 겹치는 얼굴을 고릅니다.
  max_faces: 2
  # 동시에 돌릴 프로세스 수
  workers: 4
  # Celeb-DF 논문 방식 분할에서 테스트로 뽑을 클래스별 영상 수와 난수 시드
  celebdf_test_per_class: 100
  split_seed: 0
  output_dir: "D:/Graduation-project-data/processed/faces"

paper_model:
  # 원 논문 재현(models/paper_bclstm.py, scripts/train_paper.py) 설정. 이대현·문종섭 2020, Celeb-DF
  # 입력: preprocess.output_dir/<dataset> 의 얼굴 크롭. 분할은 index.csv 의 split 열(train 490/5,539, test 100/100)
  dataset: "celebdf"
  frames: 30
  image_size: 240
  # XceptionNet: Keras ImageNet 가중치를 옮긴 timm legacy_xception. 가중치 파일은 scripts/setup_xception.py 가 받습니다.
  backbone: "legacy_xception"
  backbone_weights: "D:/Graduation-project-data/checkpoints/xception/xception-43020ad28.pth"
  # CBAM: 공간 어텐션 필터 7x7 은 논문 값. 채널 축소율 16 은 논문에 없어서 CBAM 원 논문 기본값을 씁니다.
  cbam_reduction: 16
  spatial_kernel: 7
  # ConvLSTM 은닉 채널·필터 크기는 논문에 없어서 정한 값입니다. peephole 은 논문 식 (7)~(11) 의 W_c⊗c 항입니다.
  lstm_hidden: 128
  lstm_kernel: 3
  peephole: true
  # 학습률 1e-4, Adam(β1 0.9, β2 0.999), 배치 2(real 1 + fake 1)는 논문 값입니다.
  lr: 1.0e-4
  betas: [0.9, 0.999]
  pairs_per_batch: 1
  # 논문 Table 4 는 fake 영상을 한 번씩 모두 쓰면 끝납니다(1 에폭). 더 학습하려면 늘리세요.
  epochs: 1
  seed: 0
  # GPU 메모리 절약: bf16 자동 혼합 정밀도(amp), XceptionNet 구간별 gradient checkpointing
  amp: true
  grad_checkpointing: true
  # 데이터를 읽는 자식 프로세스 수와 학습 로그 간격(스텝)
  num_workers: 4
  log_every: 50
  checkpoint_dir: "D:/Graduation-project-data/checkpoints/paper_bclstm"
  results_dir: "D:/Graduation-project-data/results/paper_bclstm"

regions:
  # 2단계 부위 신호(preprocessing/region_signals.py) 설정. 크기는 모두 얼굴 크롭(240x240) 픽셀 기준입니다.
  # 랜드마크 시간 평활 창(프레임 수). 3 이면 앞뒤 1프레임씩 함께 평균합니다. 1 이하면 끕니다.
  landmark_smoothing: 3
  # 눈·입 볼록 껍질을 사방으로 넓히는 픽셀 수. 눈꺼풀과 입술 주변까지 담습니다.
  eye_margin: 6
  mouth_margin: 4
  # 얼굴 윤곽선 양쪽으로 잡는 경계 띠 두께(픽셀). face-swap 이 가짜 얼굴을 섞는 경계가 들어오게 합니다.
  boundary_band: 6
  # t-1 과 t 에 공통인 부위 픽셀이 이보다 적으면 그 시점 값을 nan 으로 둡니다(눈을 꼭 감았을 때 등).
  min_region_pixels: 20
  # 배경 면적 비율(영상 평균)이 이보다 작으면 summary.csv 의 background_ok 를 0 으로 표시합니다. D_bg 를 믿기 어려운 영상입니다.
  min_background_ratio: 0.3
  # 동시에 돌릴 프로세스 수. CPU 를 많이 쓰니 GPU 학습과 동시에 돌리지 마세요.
  workers: 6

benchmark:
  # 3단계 장면 전환 벤치마크(preprocessing/build_transition_benchmark.py) 설정
  # FTCN 은 FF++ train 분할로 학습됐으므로, 탐지기가 본 적 없는 test 분할로 만듭니다.
  split: "test"
  # 기준으로 쓸 영상 수. fake 는 methods 에 고르게 나눕니다.
  real_videos: 70
  fake_videos: 70
  methods: ["Deepfakes", "Face2Face", "FaceSwap", "NeuralTextures"]
  # 클립 한 개의 프레임 수와 전환 중심 위치. 가장 긴 64프레임 디졸브도 앞뒤로 96프레임씩 남습니다.
  segment_frames: 256
  transition_center: 128
  # 부위·배경 신호(preprocessing/benchmark_signals.py)를 계산할 구간 길이. 전환 중심을 가운데 둡니다.
  # 128 이면 64~191번 프레임이라, 가장 긴 64프레임 디졸브(96~159) 앞뒤로 32프레임씩 여유가 있습니다.
  analysis_frames: 128
  # 전환 종류별 길이(프레임 수). hard_cut 은 길이가 없어 0 하나만 둡니다.
  transitions:
    hard_cut: [0]
    fade: [8, 16, 32]
    dissolve: [8, 16, 32, 64]
  # 합성본을 원본과 같은 조건으로 다시 압축합니다. CRF 23 은 FF++ c23 과 같은 값입니다.
  crf: 23
  preset: "medium"
  workers: 6
  output_dir: "D:/Graduation-project-data/processed/benchmark"
